name: Build Windows AppX

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    name: Build AppX (${{ matrix.arch }})
    runs-on: windows-latest
    env:
      TARGET_PLATFORM: win32
      TARGET_ARCH: x64
      NATIVE_ASSET_MANIFEST: native-assets.json
      HAS_STORE_CREDS: ${{ secrets.PC_CLIENT_ID != '' && secrets.PC_CLIENT_SECRET != '' && secrets.PC_TENANT_ID != '' && secrets.PC_STORE_ID != '' }}
    strategy:
      matrix:
        arch: [x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Load reviewed native asset pins
        shell: bash
        env:
          NATIVE_ASSET_PINS: ${{ vars.NATIVE_ASSET_PINS }}
        run: |
          node -e 'const fs=require("fs");const pins=process.env.NATIVE_ASSET_PINS ? JSON.parse(process.env.NATIVE_ASSET_PINS) : JSON.parse(fs.readFileSync("docs/native-asset-pins.json"));fs.writeFileSync("native-assets.json",JSON.stringify(pins));'

      - name: Install Windows native build toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server

      # NEXT_PUBLIC_* vars are inlined at build time by Next.js — they MUST be present
      # here as env vars (the .env file alone is fragile since prebuild can rewrite it).
      - name: Build web app (Next.js)
        shell: bash
        run: |
          if [[ -z "$NEXT_PUBLIC_FIREBASE_API_KEY" ]]; then
            echo "::error::NEXT_PUBLIC_FIREBASE_* repo secrets are not set. The app requires Firebase authentication configuration. Add them in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          ENTITLEMENT_PUBLIC_KEY: ${{ vars.ENTITLEMENT_PUBLIC_KEY }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ vars.GOOGLE_DESKTOP_CLIENT_SECRET }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY || 'phc_tPmchKhdBVkfBDgRSP7BuMr9A5m8ZDMrcQiSKzzWMeki' }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN || 'phc_tPmchKhdBVkfBDgRSP7BuMr9A5m8ZDMrcQiSKzzWMeki' }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Bundle models and binaries
        run: npm run prebuild
        env:
          TARGET_PLATFORM: win32
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          SKIP_ICON_GENERATION: 'true'

      - name: Package Electron app (AppX)
        run: npx electron-builder --win appx --${{ matrix.arch }} --publish=never

      - name: Upload AppX artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediScribe-AppX-${{ matrix.arch }}
          path: dist-electron/*.appx
          compression-level: 6
          retention-days: 1

      - name: Publish to Microsoft Store
        if: env.HAS_STORE_CREDS == 'true' && vars.RELEASE_APPROVED == 'true' && vars.NATIVE_SMOKE_TESTED_SHA == github.sha
        shell: bash
        env:
          PC_TENANT_ID: ${{ secrets.PC_TENANT_ID }}
          PC_CLIENT_ID: ${{ secrets.PC_CLIENT_ID }}
          PC_CLIENT_SECRET: ${{ secrets.PC_CLIENT_SECRET }}
          PC_STORE_ID: ${{ secrets.PC_STORE_ID }}
        run: |
          APPX=$(ls dist-electron/*.appx | head -n1)
          echo "Using AppX: $APPX"
          node scripts/publish-msstore.js "$APPX"
