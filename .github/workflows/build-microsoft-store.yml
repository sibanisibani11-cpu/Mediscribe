name: Build Windows (AppX + Installers)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TARGET_PLATFORM: win32
      TARGET_ARCH: x64
      NATIVE_ASSET_MANIFEST: native-assets.json
      HAS_STORE_CREDS: ${{ secrets.PC_CLIENT_ID != '' && secrets.PC_CLIENT_SECRET != '' && secrets.PC_TENANT_ID != '' && secrets.PC_STORE_ID != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load reviewed native asset pins
        shell: bash
        env:
          NATIVE_ASSET_PINS: ${{ vars.NATIVE_ASSET_PINS }}
        run: |
          node -e 'const fs=require("fs");const pins=process.env.NATIVE_ASSET_PINS ? JSON.parse(process.env.NATIVE_ASSET_PINS) : JSON.parse(fs.readFileSync("docs/native-asset-pins.json"));fs.writeFileSync("native-assets.json",JSON.stringify(pins));'

      - name: Install Windows native build toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server

      # NEXT_PUBLIC_* vars are inlined at build time by Next.js — they MUST be present
      # here as env vars. Writing them to .env later does NOT affect the frontend bundle.
      - name: Build application and bundle resources
        shell: bash
        run: |
          if [[ -z "$NEXT_PUBLIC_FIREBASE_API_KEY" ]]; then
            echo "::error::NEXT_PUBLIC_FIREBASE_* repo secrets are not set. The app requires Firebase authentication configuration. Add them in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PLATFORM: win32
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          SKIP_ICON_GENERATION: 'true'
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          ENTITLEMENT_PUBLIC_KEY: ${{ vars.ENTITLEMENT_PUBLIC_KEY }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ vars.GOOGLE_DESKTOP_CLIENT_SECRET }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Bundle models and binaries
        run: npm run prebuild
        env:
          TARGET_PLATFORM: win32
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          SKIP_ICON_GENERATION: 'true'

      - name: Build AppX packages (x64)
        run: npx electron-builder --win appx --x64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean win-unpacked between builds
        shell: powershell
        run: |
          Remove-Item -Recurse -Force "dist-electron\win-unpacked" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "dist-electron\win-arm64-unpacked" -ErrorAction SilentlyContinue
          Write-Host "Cleaned unpacked directories."

      - name: Build Windows installers (NSIS + portable)
        run: npx electron-builder --win nsis portable --x64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediscribe-appx
          path: |
            dist-electron/*.appx
            dist-electron/*.appxupload
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediscribe-windows-installers
          path: |
            dist-electron/*.exe
            dist-electron/*.exe.blockmap
            dist-electron/latest.yml
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

      - name: Publish to Microsoft Store
        if: env.HAS_STORE_CREDS == 'true' && vars.RELEASE_APPROVED == 'true' && vars.NATIVE_SMOKE_TESTED_SHA == github.sha
        env:
          PC_CLIENT_ID: ${{ secrets.PC_CLIENT_ID }}
          PC_CLIENT_SECRET: ${{ secrets.PC_CLIENT_SECRET }}
          PC_TENANT_ID: ${{ secrets.PC_TENANT_ID }}
          PC_STORE_ID: ${{ secrets.PC_STORE_ID }}
        run: |
          Write-Host "Locating .appx in dist-electron..."
          $appx = Get-ChildItem "dist-electron\*.appx" | Select-Object -First 1 | ForEach-Object { $_.FullName }
          if (-not $appx) {
            Write-Error "No .appx found in dist-electron/ — skipping publish."
            exit 1
          }
          Write-Host "Using AppX: $appx"
          node scripts/publish-msstore.js "$appx"
        shell: pwsh
