name: Build Cross-Platform Installers

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TARGET_PLATFORM: ${{ matrix.target_platform }}
      TARGET_ARCH: ${{ matrix.arch }}
      NATIVE_ASSET_MANIFEST: native-assets.json
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            target_platform: win32
            arch: x64
          - os: macos-latest
            platform: mac
            target_platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: mac
            target_platform: darwin
            arch: x64
          - os: ubuntu-latest
            platform: linux
            target_platform: linux
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Load reviewed native asset pins
        shell: bash
        env:
          NATIVE_ASSET_PINS: ${{ vars.NATIVE_ASSET_PINS }}
        run: |
          node -e 'const fs=require("fs");const pins=process.env.NATIVE_ASSET_PINS ? JSON.parse(process.env.NATIVE_ASSET_PINS) : JSON.parse(fs.readFileSync("docs/native-asset-pins.json"));fs.writeFileSync("native-assets.json",JSON.stringify(pins));'

      - name: Install Windows native build toolchain
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Generate platform icons
        run: node scripts/generate-icons.js

      # NEXT_PUBLIC_* vars are inlined at build time by Next.js — they MUST be present
      # here as env vars. Writing them to .env later does NOT affect the frontend bundle.
      - name: Build web app (Next.js)
        shell: bash
        run: |
          if [[ -z "$NEXT_PUBLIC_FIREBASE_API_KEY" ]]; then
            echo "::error::NEXT_PUBLIC_FIREBASE_* repo secrets are not set. The app requires Firebase authentication configuration. Add them in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          npm run build
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          SKIP_ICON_GENERATION: 'true'
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          ENTITLEMENT_PUBLIC_KEY: ${{ vars.ENTITLEMENT_PUBLIC_KEY }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ vars.GOOGLE_DESKTOP_CLIENT_SECRET }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Rebuild native modules
        run: npx electron-builder install-app-deps

      - name: Bundle models and binaries
        run: npm run prebuild
        env:
          TARGET_PLATFORM: ${{ matrix.target_platform }}
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          SKIP_ICON_GENERATION: 'true'

      - name: Test native audio runtimes
        run: node scripts/smoke-native.js

      - name: Build Electron installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        run: |
          signing=()
          if [[ "$REQUIRE_SIGNING" == true && "${{ matrix.platform }}" != linux ]]; then
            signing+=(--config.forceCodeSigning=true)
          fi
          npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish=never "${signing[@]}"

      - name: Upload candidate installers
        uses: actions/upload-artifact@v4
        with:
          name: mediscribe-${{ matrix.target_platform }}-${{ matrix.arch }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/latest*.yml
            dist-electron/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_APPROVED == 'true' && vars.NATIVE_SMOKE_TESTED_SHA == github.sha
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/latest*.yml
            dist-electron/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


